[package]
name = "browsers"
version = "0.7.5"
authors = ["Madis Liias <madisliias@gmail.com>"]
edition = "2024"
description = "Browsers"
homepage = "https://browsers.software/"
repository = "https://github.com/Browsers-software/browsers"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]

# logging library
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "std", "time", "local-time"] }
tracing-appender = "0.2.5"

# Official remote
#rolling-file = "0.2.0"

# Chrono-less fork, so doesn't pull in old time crate 0.1
rolling-file = { git = "https://github.com/browsers-software/rolling-file-rs.git", branch = "browsers" }

dirs = "6.0.0"

toml = "1.1.4"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

# UI library
#
# unstable-winit-030 gives us slint::winit_030::WinitWindowAccessor, which we need to reach the
# native window for always-on-top (macOS) and skip-taskbar (Windows) - there's no stable Slint
# API for either yet, confirmed with the Slint maintainers, see gui::app::run
#
# The version requirement below says 1.17.1, but actually resolves to 1.18.0 via the git patch
# at the bottom of this file, since 1.18.0 isn't published to crates.io yet - see [patch.crates-io].
slint = { version = "1.17.1", features = ["unstable-winit-030"] }

# decodes browser/profile icon files into slint::Image, also used by the platform icon-extraction
# code
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# parse urls
url = "2.5.8"

# parse url rules
globset = "0.4.20"

# Parse .ini files (e.g Firefox profiles.ini)
configparser = "3.2.0"

# Hash Firefox path with cityhash64, to map it to
# locked installation in profiles.ini
naive-cityhash = "0.2.0"

# To create lazy static variables
lazy_static = "1.5.0"

# clipboard access (copy URL to clipboard) - keep this version matching what i-slint-backend-winit
# wants internally, so Cargo resolves to one shared copy instead of two
copypasta = "0.10"

# macOS Core Foundation bindings
# small selection of Core Foundation libs I happen to need
[target.'cfg(target_os = "macos")'.dependencies]
# for macos_native
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2 = "0.6.4"

# for mac_paths (to get unsandboxed_home_dir for mac)
libc = "0.2.189"

# macOS-only.
# femtovg (Slint's default renderer elsewhere) has no font hinting and that causes small-text
# artifacts - Skia delegates to CoreText instead, which fixes it.
# kept this macOS-only because it needs a full native build or a matching prebuilt binary per
# target, and building from source failed outright for x86_64-pc-windows-gnu (no MSVC toolchain
# available for that).
# picked at runtime via SLINT_BACKEND=skia in main.rs.
#
# Resolves to 1.18.0 via the git patch below - must stay in sync with the other `slint` entry
# above (same features union, same resolved version) or Cargo fails to unify the two.
slint = { version = "1.17.1", features = ["renderer-skia"] }

[target.'cfg(target_os = "linux")'.dependencies]
xdg-mime = "^0.4.0"

# override ontconfig-dlopen to use dlopen, so it can be cross-compiled
fontique = {
    version = "0.11", # major and minor version must match what Slint is using
    default-features = false,
    features = ["fontconfig-dlopen", "std"]
}

# to find application .desktop files
freedesktop-desktop-entry = "0.8.2"

# to find icon theme and icon;
freedesktop-icons = "0.4.0"

# Helps parsing commands that are in Exec field in .desktop files
shell-words = "1.1.1"

# cross-platform global cursor position, used on Linux to put the popup where the mouse is
# (macOS/Windows do this natively instead, see gui/screen.rs)
mouse_position = "0.1.4"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

winapi = { version = "0.3.9", features = [
    "ntdef",
    "windef",
    "winuser",
    "minwindef",
    "shellapi",
    "wingdi",
] }

# Helps parsing commands that are in windows registry for different apps
# Same as `shell-words` but for Windows, i.e supporting \ in paths
winsplit = "0.1.0"

# Replacement for fs::canonicalize, but returns normal path instead of the `\\?` prefixed path
dunce = "1.0.5"

[build-dependencies]
# Resolves to 1.18.0 via the git patch below, same as the `slint` entries above.
slint-build = "1.17.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
# To embed .ico into .exe
# Requires rc.exe from the Windows SDK (or windres.exe and ar.exe from minGW64)
winres = "0.1.12"

# statically link vcruntime140.dll instead of requiring user to install the runtime
static_vcruntime = "3.0.0"

#[profile.dev]
#lto = true

[profile.release]
#opt-level = 'z'     # Optimize for size.
lto = true           # Enable Link Time Optimization
#codegen-units = 1   # Reduce number of codegen units to increase optimizations.
#panic = 'abort'     # Abort on panic

# 1.18.0 isn't released on crates.io yet (CHANGELOG.md on master lists it as "Unreleased"), so
# pull it straight from the Slint git repo instead. Pinned to a specific commit rather than
# `branch = "master"` so the build doesn't silently drift as upstream keeps committing.
# Once 1.18.0 is published to crates.io, remove this section and bump the `version = "1.17.1"`
# requirements above to "1.18.0" instead.
[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2" }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2" }
